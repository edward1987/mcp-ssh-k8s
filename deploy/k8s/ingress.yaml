# Example for an existing Traefik controller with a TLS-only websecure entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-ssh
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [mcp.example.com]
      secretName: mcp-ssh-tls
  rules:
    - host: mcp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-ssh
                port: { name: http }
