apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-ssh
configMapGenerator:
  - name: mcp-ssh-integrity
    files:
      - public-key=integrity-public-key.txt
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  - workload.yaml
  - ingress.yaml
  - network-policy.yaml
